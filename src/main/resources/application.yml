spring:
  application:
    name: sentinelpay
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SENTINELPAY_DB_URL:jdbc:postgresql://localhost:5432/sentinelpay}
    username: ${SENTINELPAY_DB_USERNAME:sentinelpay}
    password: ${SENTINELPAY_DB_PASSWORD:sentinelpay}
    hikari:
      pool-name: sentinelpay-pool
      maximum-pool-size: ${SENTINELPAY_DB_POOL_SIZE:32}
      minimum-idle: 8
      connection-timeout: 3000
      validation-timeout: 1000
      idle-timeout: 600000
      max-lifetime: 1800000

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false

  data:
    redis:
      host: ${SENTINELPAY_REDIS_HOST:localhost}
      port: ${SENTINELPAY_REDIS_PORT:6379}
      timeout: 2s

  kafka:
    bootstrap-servers: ${SENTINELPAY_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    client-id: sentinelpay
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 10000
        linger.ms: 5
    consumer:
      group-id: sentinelpay-settlement
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        isolation.level: read_committed
    listener:
      ack-mode: manual_immediate
      concurrency: 3

  jackson:
    default-property-inclusion: non_null

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SENTINELPAY_HTTP_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

sentinelpay:
  outbox:
    poll-interval-ms: 200
    batch-size: 100
    max-retries: 5
    publish-timeout-ms: 3000
  idempotency:
    lock-ttl: 30s
    response-ttl: 24h

logging:
  level:
    com.sentinelpay: INFO
    org.flywaydb: INFO

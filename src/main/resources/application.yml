spring:
  application:
    name: sentinelpay
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SENTINELPAY_DB_URL:jdbc:postgresql://localhost:5432/sentinelpay}
    username: ${SENTINELPAY_DB_USERNAME:sentinelpay}
    password: ${SENTINELPAY_DB_PASSWORD:sentinelpay}
    hikari:
      pool-name: sentinelpay-pool
      maximum-pool-size: ${SENTINELPAY_DB_POOL_SIZE:50}
      minimum-idle: 10
      connection-timeout: 2000
      validation-timeout: 1000
      idle-timeout: 600000
      max-lifetime: 1800000

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false

  data:
    redis:
      host: ${SENTINELPAY_REDIS_HOST:localhost}
      port: ${SENTINELPAY_REDIS_PORT:6379}
      timeout: 2s
      lettuce:
        pool:
          max-active: 50
          max-idle: 10
          min-idle: 2

  kafka:
    bootstrap-servers: ${SENTINELPAY_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    client-id: sentinelpay
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 2147483647
      compression-type: lz4
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 15000
        request.timeout.ms: 5000
        linger.ms: 5
    consumer:
      group-id: sentinelpay-settlement
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: batch
      concurrency: 3

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SENTINELPAY_HTTP_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

sentinelpay:
  outbox:
    topic: ledger.transactions.v1
    poll-interval-ms: 50
    batch-size: 500
    send-timeout-ms: ${SENTINELPAY_OUTBOX_SEND_TIMEOUT_MS:3000}
    max-retries: 5
    retry-base-seconds: 2
    metrics-refresh-ms: 5000
  idempotency:
    header-name: Idempotency-Key
    in-flight-ttl: 30s
    completed-ttl: 24h
    max-body-bytes: 1048576
  reconciliation:
    chunk-size: 1000
    max-concurrency: 50

logging:
  level:
    com.sentinelpay: INFO
    org.flywaydb: INFO
